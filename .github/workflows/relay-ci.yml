# Owned by this repo (not generated by Upptime).
name: Relay CI

on:
  push:
    paths:
      - "relay-worker/**"
      - ".github/workflows/relay-ci.yml"
  pull_request:
    paths:
      - "relay-worker/**"
      - ".github/workflows/relay-ci.yml"

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check src/index.js
      - name: English copy tests
        run: node --test src/mail-copy.test.js
