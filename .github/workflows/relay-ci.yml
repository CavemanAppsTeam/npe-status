# Owned by this repo (not generated by Upptime).
name: Relay CI

on:
  push:
    paths:
      - "relay-worker/**"
      - ".github/workflows/relay-ci.yml"
  pull_request:
    paths:
      - "relay-worker/**"
      - ".github/workflows/relay-ci.yml"

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check src/index.js
      - name: English copy tests
        run: node --test src/mail-copy.test.js
      - name: Production health smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: .
        run: |
          body=$(curl -fsS "https://npe-uptime-relay.gabriel-049.workers.dev/health")
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          count=$(echo "$body" | sed -n 's/.*"recipientCount":\([0-9][0-9]*\).*/\1/p')
          test -n "$count" && test "$count" -ge 1
